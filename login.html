<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link rel="stylesheet" href="/static/style.css?v={{ STATIC_V }}">
  <link rel="stylesheet" href="/static/topnav.css?v={{ STATIC_V }}">
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 350px; padding: 28px; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <h1 style="margin-bottom:4px;">Welcome back</h1>
    <p class="muted" style="margin-top:0;">Enter your password to open the dashboard.</p>
    {% if error %}<div class="flash err">Wrong password — try again.</div>{% endif %}
    <form method="post" action="/login">
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" autofocus autocomplete="current-password">
      </label>
      <button class="btn primary" type="submit" style="width:100%;justify-content:center;">Log in</button>
    </form>
  </div>
</div>
</body>
</html>
