services:
  - type: web
    name: adops-manager
    runtime: python
    # 512 MB (starter) could not hold the background sweep + Chromium + hundreds of
    # accounts: fresh deploys OOM-killed ~18 min in, every time (Render events 21 Sep).
    # 2 GB (standard) gives the sweep and the Instant-Page browser real headroom.
    plan: standard
    # Chromium for the Instant Page builder is NOT taken from this build step: Render's native
    # runtime drops the build-time ~/.cache. The app installs it once into /data/pw-browsers on
    # first use (app/instant_page_builder.py) — the disk persists across deploys.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true            # deploys on every push to main
    disk:                        # ⚠ REQUIRED — SQLite + cookie file live here (§9.8)
      name: adops-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: MALLOC_ARENA_MAX   # cap glibc malloc arenas — the classic cause of
        value: "2"              # slowly-climbing RSS in threaded Python services
      - key: DATA_DIR
        value: /data
      - key: MEM_LIMIT_MB      # display + browser memory gate scale to the plan; cgroup is
        value: "2048"          # read first, this is the fallback (Standard plan = 2 GB)
      - key: BUSINESS_TZ
        value: America/New_York
      - key: TIKTOK_APP_ID
        sync: false              # set in the Render dashboard — never commit
      - key: TIKTOK_APP_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false              # https://<your-domain>/oauth/callback — EXACT match
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SECURITY_PIN
        sync: false              # optional; empty disables the PIN gate
