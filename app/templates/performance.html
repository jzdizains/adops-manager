{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div><h1>Performance</h1>
    <div class="muted">Live metrics — refreshes every 15s <span id="pfSynced"></span></div></div>
  <div class="actions">
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-soft);cursor:pointer;">
      <input type="checkbox" id="pfSound" style="width:auto;"> 🔊 ding on conversions
    </label>
  </div>
</div>

<div class="grid cols-3">
  <div class="card mb0"><div class="stat">
    <div class="stat-icon">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
    </div>
    <div><div class="stat-label">Spend</div><div class="stat-value" id="pfSpend">—</div></div>
  </div></div>
  <div class="card mb0"><div class="stat">
    <div class="stat-icon ok">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>
    </div>
    <div><div class="stat-label">Revenue</div><div class="stat-value" id="pfRevenue">—</div></div>
  </div></div>
  <div class="card mb0"><div class="stat">
    <div class="stat-icon warn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 8v4l3 3M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
    <div><div class="stat-label">Profit</div><div class="stat-value" id="pfProfit">—</div></div>
  </div></div>
</div>

<div style="height:16px;"></div>

<div class="grid cols-3">
  <div class="card mb0"><div class="stat">
    <div><div class="stat-label">ROAS</div><div class="stat-value" id="pfRoas">—</div></div>
  </div></div>
  <div class="card mb0"><div class="stat">
    <div><div class="stat-label">Conversions</div><div class="stat-value" id="pfConv">—</div></div>
  </div></div>
  <div class="card mb0"><div class="stat">
    <div><div class="stat-label">Clicks</div><div class="stat-value" id="pfClicks">—</div></div>
  </div></div>
</div>

<div style="height:16px;"></div>

<div class="card">
  <div class="card-header"><span class="card-title">Live feed</span>
    <span class="card-meta" id="pfStatus">connecting…</span></div>
  <div id="pfFeed" style="max-height:280px;overflow:auto;font-size:13px;">
    <div class="empty">Waiting for events…</div>
  </div>
</div>

<audio id="pfDing" src="/static/cash-money.wav" preload="none"></audio>
{% endblock %}

{% block scripts %}
<script>
  // Overlap-guarded auto-refresh: AbortController cancels an in-flight poll
  // before starting the next; the page NEVER blanks mid-refresh (§8).
  var lastId = 0, lastConversions = null, inflight = null;

  function fmt(n, money) { return (money ? "$" : "") + Number(n).toLocaleString("en-US", {minimumFractionDigits: money ? 2 : 0, maximumFractionDigits: 2}); }

  function apply(d) {
    document.getElementById("pfSpend").textContent = fmt(d.spend, true);
    document.getElementById("pfRevenue").textContent = fmt(d.revenue, true);
    var p = document.getElementById("pfProfit");
    p.textContent = fmt(d.profit, true);
    p.style.color = d.profit >= 0 ? "var(--ok)" : "var(--err)";
    document.getElementById("pfRoas").textContent = Number(d.roas).toFixed(2);
    document.getElementById("pfConv").textContent = d.conversions;
    document.getElementById("pfClicks").textContent = d.clicks;
    document.getElementById("pfSynced").textContent = "· campaigns synced " + d.synced_ago;

    if (d.events && d.events.length) {
      var feed = document.getElementById("pfFeed");
      if (feed.querySelector(".empty")) feed.innerHTML = "";
      d.events.forEach(function (e) {
        lastId = Math.max(lastId, e.id);
        var row = document.createElement("div");
        row.style.cssText = "padding:6px 2px;border-bottom:1px solid var(--border-soft);display:flex;gap:8px;";
        var icon = { conversion: "💰", launch: "🚀", error: "⚠️" }[e.kind] || "·";
        row.innerHTML = "<span>" + icon + "</span><span>" + e.message +
          "</span><span class='muted' style='margin-left:auto;font-size:11px;'>" +
          new Date(e.at).toLocaleTimeString() + "</span>";
        feed.prepend(row);
      });
    }
    // audio ding when the conversion count rises (optional)
    if (lastConversions !== null && d.conversions > lastConversions &&
        document.getElementById("pfSound").checked) {
      var a = document.getElementById("pfDing");
      a.play().catch(function () {});
    }
    lastConversions = d.conversions;
  }

  function poll() {
    if (inflight) inflight.abort();               // overlap guard
    inflight = new AbortController();
    fetch("/performance/data?last_id=" + lastId, { signal: inflight.signal })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        apply(d);
        document.getElementById("pfStatus").textContent = "live · updated " + new Date().toLocaleTimeString();
      })
      .catch(function (err) {
        if (err.name !== "AbortError")
          document.getElementById("pfStatus").textContent = "reconnecting…";
      });
  }
  poll();
  setInterval(poll, 15000);
</script>
{% endblock %}
