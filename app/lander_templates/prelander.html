<!doctype html>
<html lang="en" data-theme="{{ cfg.theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="{{ '#0b0b10' if cfg.theme == 'dark' else '#ffffff' }}">
<title>{{ cfg.headline or 'Open in your browser' }}</title>
<style>
:root{--accent:{{ cfg.accent }};--bg:#0b0b10;--fg:#f4f4f8;--muted:#a9adbd;--subtle:#6d7186;--card:#15151d;--border:rgba(255,255,255,.08)}
html[data-theme="light"]{--bg:#f6f6f9;--fg:#101018;--muted:#4b4f60;--subtle:#8a8ea0;--card:#ffffff;--border:rgba(0,0,0,.08)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 22px;position:relative;overflow:hidden}
.glow{position:fixed;left:50%;top:-200px;width:600px;height:600px;transform:translateX(-50%);border-radius:50%;opacity:.28;filter:blur(110px);background:radial-gradient(circle,var(--accent),transparent 70%);pointer-events:none}
.wrap{position:relative;width:100%;max-width:400px;text-align:center;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wrap{animation:none}}
.brand{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);margin-bottom:22px}
.icon{width:84px;height:84px;margin:0 auto 24px;display:grid;place-items:center;border-radius:24px;background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.icon svg{width:36px;height:36px;color:var(--accent);stroke-width:2.2}
h1{font-size:clamp(1.9rem,9vw,2.5rem);font-weight:800;line-height:1.05;letter-spacing:-.03em;margin-bottom:12px}
p{color:var(--muted);font-size:16px;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:26px;padding:18px 20px;border:none;border-radius:16px;background:var(--accent);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 38%,transparent)}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.7}
.note{margin-top:14px;font-size:12.5px;color:var(--subtle)}
.browsers{display:flex;justify-content:center;gap:16px;margin-top:22px;color:var(--subtle);font-size:12px}
.browsers span{display:inline-flex;align-items:center;gap:6px}
.browsers svg{width:16px;height:16px}
</style>
{% if cfg.pixel %}
<script>
!function (w, d, t) { w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var r="https://analytics.tiktok.com/i18n/pixel/events.js",o=n&&n.partner;ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=r,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};n=document.createElement("script");n.type="text/javascript",n.async=!0,n.src=r+"?sdkid="+e+"&lib="+t;e=document.getElementsByTagName("script")[0];e.parentNode.insertBefore(n,e)};
  ttq.load('{{ cfg.pixel }}');
  /* ttq.page() is called by the runtime below, AFTER identify(): the page view and every later
     event then carry the visitor's hashed external_id (the same value the server events send). */
}(window, document, 'ttq');
</script>
{% endif %}
</head>
<body>
<div class="glow"></div>
<main class="wrap">
  {% if cfg.brand %}<div class="brand">{{ cfg.brand }}</div>{% endif %}
  <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
  <h1 id="h1">{{ cfg.headline }}</h1>
  <p id="lead" data-inapp="{{ cfg.text }}" data-browser="{{ cfg.inbrowser_text }}">{{ cfg.text }}</p>
  <button type="button" class="btn" id="go">{{ cfg.button }} <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <div class="note" id="note">{{ cfg.note }}</div>
  <div class="browsers" id="browsers"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 8.5 4.8L12 12z"/></svg>Safari</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="M21.2 8H12M3.9 17.4l4.6-8M15.5 20.6 12 12"/></svg>Chrome</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Secure</span></div>
</main>
<script>window.LANDER_CFG = {{ cfg_json|safe }};</script>
<script>{{ pass_js|safe }}</script>
<script>{{ runtime_js|safe }}</script>
<script>
(function () {
  var go = document.getElementById("go"), lead = document.getElementById("lead"), note = document.getElementById("note"), browsers = document.getElementById("browsers");
  // a real browser: nothing to escape — say so and continue straight away on tap
  if (!L.env.inapp) { lead.textContent = lead.getAttribute("data-browser") || lead.textContent; note.hidden = true; browsers.hidden = true; }
  var busy = false;
  go.addEventListener("click", function () {
    if (busy) return; busy = true; go.disabled = true;
    L.ready(function (cfg) {
      var to = L.route();                              // the rules pick the next page for this visitor (else cfg.next)
      if (!to) { busy = false; go.disabled = false; return; }
      if (cfg.pixel_event) L.pixel(cfg.pixel_event, { content_name: "continue" });   // a real tap, nothing else
      if (L.env.inapp) { L.escape(to); } else { L.track("continue", { bucket: "direct" }); L.go(to); }
    });
  });
})();
</script>
</body>
</html>
